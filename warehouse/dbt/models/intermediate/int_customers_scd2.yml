version: 2

models:
  - name: int_customers_scd2
    description: >
      Derived SCD2 history of customer KYC status. One contiguous validity interval per
      (customer_id, valid_from); open interval carries the far-future sentinel valid_to
      and is_current = 1. Composite-key uniqueness and interval contiguity are checked by
      tests/assert_scd2_customers_unique.sql (formal integrity suite lands in P7).
    columns:
      - name: customer_id
        description: The customer this interval belongs to.
        data_tests: [not_null]
      - name: valid_from
        description: Inclusive start of the interval (a signup or KYC-event timestamp).
        data_tests: [not_null]
      - name: valid_to
        description: >
          Exclusive end of the interval = next change ts, or 2999-12-31 for the open one.
        data_tests: [not_null]
      - name: is_current
        description: 1 for the open (latest) interval, else 0. Exactly one per customer.
      - name: kyc_status
        description: "KYC status during the interval — none | submitted | pending | verified | rejected."
        data_tests:
          - accepted_values:
              arguments:
                values: ['none', 'submitted', 'pending', 'verified', 'rejected']
