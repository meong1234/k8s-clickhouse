version: 2

models:
  - name: int_accounts_scd2
    description: >
      Derived SCD2 history of account status. One contiguous validity interval per
      (account_id, valid_from); open interval carries the far-future sentinel valid_to and
      is_current = 1. Composite-key uniqueness checked by
      tests/assert_scd2_accounts_unique.sql.
    columns:
      - name: account_id
        description: The account this interval belongs to.
        data_tests: [not_null]
      - name: customer_id
        description: The customer that owns the account.
        data_tests: [not_null]
      - name: valid_from
        description: Inclusive start of the interval (open or account-event timestamp).
        data_tests: [not_null]
      - name: valid_to
        description: Exclusive end = next change ts, or 2999-12-31 for the open interval.
        data_tests: [not_null]
      - name: is_current
        description: 1 for the open (latest) interval, else 0. Exactly one per account.
      - name: status
        description: "Account status during the interval — active | frozen | closed."
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'frozen', 'closed']
