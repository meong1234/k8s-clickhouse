version: 2

models:
  - name: dim_customers
    description: >
      Conformed SCD2 customer dimension — one row per (customer_id, valid_from) validity
      interval, plus one synthetic unknown-member row (customer_key = 0). Surrogate
      customer_key = cityHash64(customer_id, valid_from), computed here only; facts pull it
      from an ASOF join on event time. kyc_status is the SCD2-varying attribute;
      risk_tier/country/region are static, carried across a customer's versions.
    columns:
      - name: customer_key
        description: >
          Surrogate key, cityHash64(customer_id, valid_from). Unique per validity interval;
          0 is the unknown member. Target of fct_*.customer_key relationships tests.
        data_tests: [not_null, unique]
      - name: customer_id
        description: Natural customer id (repeats across the customer's intervals).
        data_tests: [not_null]
      - name: valid_from
        description: Inclusive start of the interval (signup, or a KYC-change timestamp).
        data_tests: [not_null]
      - name: valid_to
        description: Exclusive end = next change ts, or the far-future sentinel for the open interval.
        data_tests: [not_null]
      - name: is_current
        description: 1 for the open (latest) interval of a customer, else 0.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: kyc_status
        description: "KYC status during the interval — none | submitted | pending | verified | rejected (unknown for the key-0 member)."
      - name: risk_tier
        description: "Customer risk tier — low | medium | high (static across versions)."
      - name: country
        description: Customer country code (static).
      - name: region
        description: Region the country rolls up to, from seed_countries (static).
