---
# ClickHouse never creates buckets — an object_storage disk assumes its bucket
# already exists — so the bucket is a deploy-time artifact, created here.
#
# Idempotent by construction (`mc mb --ignore-existing`), which matters because Flux
# re-applies this Job's manifest unchanged on every reconcile: a completed Job with an
# identical spec is left alone, and any re-creation (prune + re-apply, cluster rebuild)
# simply finds the bucket already there.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: minio
  labels:
    app: minio-create-bucket
spec:
  # Enough retries to ride out MinIO's first boot (the alias loop below already waits),
  # few enough that a genuine misconfiguration surfaces instead of looping forever.
  backoffLimit: 6
  # ttlSecondsAfterFinished is deliberately UNSET: the completed Job (and its logs) stay
  # visible for `make minio-status`, which is how we confirm the bucket step ran.
  template:
    metadata:
      labels:
        app: minio-create-bucket
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              # The Service can resolve before MinIO answers, and Job ordering against a
              # StatefulSet is not expressible in k8s — so poll rather than assume.
              for i in $(seq 1 60); do
                if mc alias set local "http://minio.minio.svc.cluster.local:9000" \
                     "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; then
                  echo "minio reachable after ${i} attempt(s)"
                  break
                fi
                echo "waiting for minio... (${i}/60)"
                sleep 2
              done
              mc alias set local "http://minio.minio.svc.cluster.local:9000" \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/clickhouse-cas
              # CAS relies on stable object tokens; versioning would give the same key
              # several ETags, so the bucket is left unversioned (also the SeaweedFS
              # fallback's known-bad combination — see docs/cas-local-s3-plan.md §5).
              mc ls local
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
            # mc writes its config under $HOME; the image's default user may not own /,
            # so point it at a writable path explicitly.
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
