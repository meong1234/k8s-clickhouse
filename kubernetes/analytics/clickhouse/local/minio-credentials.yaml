apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: clickhouse
type: Opaque
stringData:
  # The CAS disk's S3 credentials, consumed by the CHI pods as env
  # (CAS_S3_ACCESS_KEY_ID / CAS_S3_SECRET_ACCESS_KEY) and read back by
  # config.d/cas_disk.xml via `from_env` - the same indirection the admin password uses.
  #
  # This is a COPY of kubernetes/analytics/minio/local/minio-credentials.yaml: a Secret
  # is namespaced, the object store lives in `minio`, and the minio layer deliberately
  # does not write into a namespace it does not own. Rotate both files together.
  #
  # Dev-only: these are MinIO's ROOT keys (see the minio overlay for why), and the whole
  # cluster is local k3d behind no ingress.
  CAS_S3_ACCESS_KEY_ID: "minioadmin"
  CAS_S3_SECRET_ACCESS_KEY: "minioadmin123"
