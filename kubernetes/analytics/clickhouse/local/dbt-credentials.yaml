apiVersion: v1
kind: Secret
metadata:
  name: dbt-credentials
  namespace: clickhouse
type: Opaque
stringData:
  # SHA256 hex of the scoped `dbt` ClickHouse user's password. Default here is the
  # hash of "dbt123" (dev-only; the whole cluster is local k3d behind no ingress).
  # To rotate:  make ch-password PASSWORD=yournewpassword
  # then paste the output below (and update NIMBUS_CH_PASSWORD / the dbt profile default).
  # Consumed by the CHI `dbt/password_sha256_hex` user in
  # kubernetes/analytics/clickhouse/base/clickhouse.yaml via secretKeyRef.
  dbt_password_sha256_hex: "8c866a1328dd26d3bb3d4dd0ef73c845f68ea829b6005e50bc3b3e32bdc0d1f0"
