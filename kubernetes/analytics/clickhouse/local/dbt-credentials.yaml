apiVersion: v1
kind: Secret
metadata:
  name: dbt-credentials
  namespace: clickhouse
type: Opaque
stringData:
  # This Secret carries the scoped `dbt` user's password in BOTH forms, because two
  # consumers need two different representations of the SAME dev password ("dbt123"):
  #   - the CHI stores users by SHA256 hash        -> dbt_password_sha256_hex
  #   - dbt sends the real password over HTTP       -> dbt_password (P3 in-cluster runner)
  # Dev-only: the whole cluster is local k3d behind no ingress.
  # To rotate: run `make ch-password PASSWORD=yournewpassword`, paste the hash into
  # dbt_password_sha256_hex, put the plaintext into dbt_password, and update the
  # profiles.yml env_var default (NIMBUS_CH_PASSWORD).

  # Consumed by the CHI `dbt/password_sha256_hex` user in
  # kubernetes/analytics/clickhouse/base/clickhouse.yaml via secretKeyRef.
  dbt_password_sha256_hex: "8c866a1328dd26d3bb3d4dd0ef73c845f68ea829b6005e50bc3b3e32bdc0d1f0"
  # Plaintext, consumed as NIMBUS_CH_PASSWORD by the dbt-runner / dbt-tester CronJobs
  # (kubernetes/analytics/dbt/base) via secretKeyRef. Must be the pre-image of the hash above.
  dbt_password: "dbt123"
