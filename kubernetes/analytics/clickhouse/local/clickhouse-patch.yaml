# Local (laptop) overlay for ClickHouse.
#
# Relax the base's HARD replica anti-affinity to SOFT so both replicas schedule
# on a small cluster, and shrink resources to fit a laptop's Docker VM. Data is
# still fully replicated across the 2 replicas (ReplicatedMergeTree) - the only
# thing lost locally is the "one replica per physical node" guarantee, which the
# production base manifest keeps.
- op: replace
  path: /spec/templates/podTemplates/0/spec/affinity
  value:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - clickhouse
            topologyKey: kubernetes.io/hostname
# Memory: the k3d nodes have 16 GiB each, so the earlier 1536Mi cap was purely a
# "laptop realism" choice, not a host limit. It proved too tight to run the full batch
# suite + the P6 real-time cascade together (background merges pin RSS at the cap and
# tiny seed inserts / SCD2 test bursts OOM). Raised to 4Gi (operator derives
# max_server_memory_usage = 0.9 x limit = ~3.6 GiB), which comfortably fits the batch
# spine, the streaming MV cascade, and the watermarked reconciliation. Still bounded
# (this is a laptop, not prod) and fully local — base/prod keeps the production sizing.
- op: replace
  path: /spec/templates/podTemplates/0/spec/containers/0/resources
  value:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 4Gi

# Background-merge memory safety (laptop overlay only; base/prod keeps ClickHouse
# defaults). Even with the 4Gi limit above (~3.6 GiB server-wide), keeping each merge
# cheap is still worthwhile. Bulk-loading the laptop-real bronze (~2M ledger + 10M app
# events + 1M auths, all PARTITION BY toYYYYMM over 18 months) spawns many background
# merges; with the default merge_max_block_size=8192 a single merge of the wide
# LowCardinality rows can want 600+ MiB, and enough of them at once pin RSS at the cap
# -> MEMORY_LIMIT_EXCEEDED. We make each merge cheap instead of buying RAM: holding
# 1024 rows at a time (8x fewer) drops per-merge peak memory ~8x. This is the one merge
# knob with no cross-setting sanity check (reducing background_pool_size would also
# require lowering the interdependent number_of_free_entries_in_pool_* thresholds or CH
# refuses to boot). Applies to system *_log tables too (they also merge under load).
# Paired with the 250k insert blocks in loaders/load_bronze.sh, which keep part counts
# low, this keeps total merge memory well under the cap without losing correctness.
- op: add
  path: /spec/configuration/settings/merge_tree~1merge_max_block_size
  value: "1024"
