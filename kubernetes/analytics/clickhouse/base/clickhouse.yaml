---
# ClickHouseInstallation (CHI): one cluster, 1 shard x 2 replicas.
#
# Because there are 2 replicas per shard, tables created as ReplicatedMergeTree
# keep a full copy of the data on BOTH pods and stay in sync through Keeper -
# the standard production High-Availability pattern. The operator auto-generates
# <remote_servers>, per-pod <macros> ({shard}/{replica}/{cluster}) and the
# <zookeeper> config, so replicated DDL "just works" (see `make ch-demo`).
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: clickhouse
  namespace: clickhouse
spec:
  defaults:
    templates:
      podTemplate: clickhouse-pod
      dataVolumeClaimTemplate: data
      logVolumeClaimTemplate: logs
  configuration:
    # ---- Wire ClickHouse to the standalone Keeper quorum by NAME ----
    # The operator discovers the 3 keeper endpoints automatically (no hard-coded
    # service DNS) and retries until they are reachable.
    zookeeper:
      keeper:
        name: clickhouse-keeper
        # namespace defaults to this CHI's namespace (clickhouse)
        # serviceType defaults to "replicas" (one ZK node entry per keeper pod)
      session_timeout_ms: 30000
      operation_timeout_ms: 10000

    clusters:
      - name: default
        layout:
          shardsCount: 1
          replicasCount: 2

    # ---- Users ----
    # The admin password (as a SHA256 hex) is injected from a Kubernetes Secret
    # rather than committed in-line. The operator renders it via `from_env`.
    users:
      admin/password_sha256_hex:
        valueFrom:
          secretKeyRef:
            name: clickhouse-credentials
            key: admin_password_sha256_hex
      admin/profile: default
      admin/quota: default
      admin/access_management: "1"
      admin/named_collection_control: "1"
      admin/networks/ip:
        - "0.0.0.0/0"
        - "::/0"

      # ---- Scoped `dbt` user (least-privilege, for the warehouse layer) ----
      # Authenticates via a SHA256 hash from the `dbt-credentials` Secret (local
      # overlay). It deliberately does NOT get access_management.
      #
      # SPIKE OUTCOME (P0): `allow_databases` was tried first but proved
      # insufficient - dbt-clickhouse introspects a clustered profile via
      # clusterAllReplicas(), which needs the GLOBAL `REMOTE` privilege that a
      # database allow-list cannot express. And because an XML-defined user lives
      # in read-only `users_xml` access storage, `GRANT ... TO dbt` over SQL fails
      # (ACCESS_STORAGE_READONLY) - so grants MUST come from this config. The
      # working, GitOps-native answer is the config-native <grants> block below
      # (rendered into users.xml by the operator); no SQL bootstrap script needed.
      # Full details in warehouse/README.md.
      dbt/password_sha256_hex:
        valueFrom:
          secretKeyRef:
            name: dbt-credentials
            key: dbt_password_sha256_hex
      dbt/profile: default
      dbt/quota: default
      dbt/networks/ip:
        - "0.0.0.0/0"
        - "::/0"
      # DB-scoped RBAC via a config-native <grants> block (rendered into
      # users.xml by the operator). GRANT ALL is scoped per-database, so `dbt`
      # gets full DDL/DML on the nimbus_* databases only and is denied everything
      # else (e.g. `demo`). system read is for dbt introspection; REMOTE is
      # required because dbt-clickhouse introspects via clusterAllReplicas() on a
      # clustered profile. This is the pure-CHI path: no SQL bootstrap script.
      dbt/grants/query:
        - "GRANT REMOTE ON *.*"
        - "GRANT CLUSTER ON *.*"
        - "GRANT SELECT ON system.*"
        - "GRANT ALL ON nimbus_raw.*"
        - "GRANT ALL ON nimbus_staging.*"
        - "GRANT ALL ON nimbus_intermediate.*"
        - "GRANT ALL ON nimbus_marts.*"
        - "GRANT ALL ON nimbus_metrics.*"
        # P6 (real-time lambda): the streaming plane. dbt deploys the MV cascade /
        # dictionaries here as the control plane; grants are enumerated per-DB (no
        # prefix wildcard), so these two MUST be listed or every rt deploy fails.
        - "GRANT ALL ON nimbus_stream.*"
        - "GRANT ALL ON nimbus_rt.*"

    # ---- CAS disk (Altinity content-addressed object storage) ----
    # Experimental, Antalya 26.6+ only - see docs/cas-local-s3-plan.md.
    #
    # Rendered verbatim by the operator into config.d/. The credentials are NOT in this
    # file: `from_env` makes the server read them at config-load time from the pod env,
    # which comes from the `minio-credentials` Secret (podTemplate below) - the same
    # indirection the admin password uses.
    #
    # `skip_access_check` is deliberately left at its default (false): the boot-time
    # capability probe asserting conditional writes / ranged reads is the ONLY thing
    # standing between us and silent corruption on an S3 that fakes the semantics.
    # Phase A (`make minio-probe`) says MinIO passes; the probe re-checks it for real.
    #
    # The endpoint is the in-cluster MinIO service in base as well as local. That is a
    # branch-scoped compromise: a real deployment would point base at a real bucket
    # (and a scoped IAM principal) and let the local overlay patch it to MinIO.
    files:
      config.d/cas_disk.xml: |
        <clickhouse>
          <storage_configuration>
            <disks>
              <cas>
                <type>object_storage</type>
                <object_storage_type>s3</object_storage_type>
                <metadata_type>cas</metadata_type>
                <!-- Must be unique AND stable per pool member; the operator's per-pod
                     {replica} macro is both. Reusing another member's id would let two
                     servers claim the same mount lease. -->
                <cas_server_root_id>{replica}</cas_server_root_id>
                <endpoint>http://minio.minio.svc.cluster.local:9000/clickhouse-cas/cas/{cluster}/</endpoint>
                <access_key_id from_env="CAS_S3_ACCESS_KEY_ID"/>
                <secret_access_key from_env="CAS_S3_SECRET_ACCESS_KEY"/>
                <region>us-east-1</region>
                <!-- Required by the CAS docs: without a long-lived keep-alive pool the
                     mount-lease renewals get starved behind TIME_WAIT churn and a
                     healthy server can lose its lease under load. -->
                <http_keep_alive_timeout>30</http_keep_alive_timeout>
                <http_keep_alive_max_requests>10000</http_keep_alive_max_requests>
                <!-- Fixed at pool creation and unchangeable afterwards: changing it
                     means a new bucket prefix. xxh3-128 = fast, no known collision
                     classes. -->
                <cas_blob_hash>xxh3-128</cas_blob_hash>
              </cas>
              <!-- Local read-through cache in front of CAS. Lives on the existing 10Gi
                   data PVC, so keep max_size well under it. Every policy below uses
                   cas_cache, never `cas` directly. -->
              <cas_cache>
                <type>cache</type>
                <disk>cas</disk>
                <path>/var/lib/clickhouse/cas_cache/</path>
                <max_size>3Gi</max_size>
              </cas_cache>
            </disks>
            <policies>
              <!-- Pure CAS: no local volume at all, so every effect (relink, GC, an
                   outage) is visible immediately. Used by demo.* in Phases B and C. -->
              <cas>
                <volumes>
                  <main>
                    <disk>cas_cache</disk>
                  </main>
                </volumes>
              </cas>
              <!-- Local hot -> CAS cold. The insert path is not optimised for CAS yet,
                   so writes land on `default` and a table TTL moves aged partitions
                   down to the CAS volume. This is what bronze uses in Phase D. -->
              <cas_tiered>
                <volumes>
                  <hot>
                    <disk>default</disk>
                    <volume_priority>1</volume_priority>
                  </hot>
                  <cas>
                    <disk>cas_cache</disk>
                  </cas>
                </volumes>
              </cas_tiered>
            </policies>
          </storage_configuration>
        </clickhouse>

    profiles:
      default/max_memory_usage: "1500000000"     # ~1.5 GiB, fits the 2Gi pod limit
      default/load_balancing: "nearest_hostname"
      default/max_execution_time: "60"

    quotas:
      default/interval/duration: "3600"

    settings:
      max_concurrent_queries: "50"
      max_connections: "512"

  templates:
    podTemplates:
      - name: clickhouse-pod
        metadata:
          labels:
            app: clickhouse
          annotations:
            prometheus.io/port: "8001"
            prometheus.io/scrape: "true"
        spec:
          # Hard anti-affinity so the two replicas of the shard never share a
          # node - a node loss then costs at most one replica, not the data.
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: "app"
                        operator: In
                        values:
                          - clickhouse
                  topologyKey: "kubernetes.io/hostname"
          containers:
            - name: clickhouse
              # Antalya 26.6 (experimental) for CAS - see docs/cas-local-s3-plan.md.
              # Keeper stays on the 26.3 LTS build.
              image: altinity/clickhouse-server:26.6.4.20001.altinityantalya
              imagePullPolicy: IfNotPresent
              # Read back by config.d/cas_disk.xml through `from_env`, so the CAS
              # credentials never appear in the CHI or in the rendered config.
              env:
                - name: CAS_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: CAS_S3_ACCESS_KEY_ID
                - name: CAS_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: CAS_S3_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 2Gi
    volumeClaimTemplates:
      - name: data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
      - name: logs
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
